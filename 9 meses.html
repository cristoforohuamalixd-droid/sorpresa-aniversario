<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>9 Meses Juntos 💖</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#ffe6f0;
  overflow-x:hidden;
  scroll-behavior:smooth;
}

section{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

button{
  padding:12px 25px;
  margin:10px;
  border:none;
  border-radius:8px;
  background:#ff4da6;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#ff1a8c;
  transform:scale(1.05);
}

/* Corazones */
.heart{
  position:fixed;
  top:-20px;
  color:#ff4da6;
  animation:fall 5s linear infinite;
}

@keyframes fall{
  to{ transform:translateY(100vh); opacity:0;}
}

/* Álbum */
#album{
  background:linear-gradient(135deg,#1a001f,#330033);
  flex-direction:row;
  justify-content:space-between;
  align-items:center;
}

#fotosIzquierda, #fotosDerecha{
  display:flex;
  flex-direction:column;
  gap:20px;
}

#fotosIzquierda img, #fotosDerecha img{
  width:140px;
  border-radius:12px;
  transition:0.4s;
}

#fotosIzquierda img:hover, #fotosDerecha img:hover{
  transform:scale(1.1) rotate(0deg);
}

#textoCentral{
  font-size:52px;
  font-weight:bold;
  color:#ff66cc;
  max-width:50%;
  line-height:1.4;
  background:rgba(255,255,255,0.08);
  padding:25px;
  border-radius:20px;
}
</style>
</head>

<body>

<!-- INICIO -->
<section id="inicio">
  <h1>¡Sorpresa! 💖</h1>
  <p>
    Te amo mucho 💘<br>
    Ya cumplimos 9 meses juntos 💖<br>
    Y esto es solo el comienzo ✨
  </p>
  <button onclick="irSeccion('mensaje')">Abrir Mensaje ✨</button>
  <button onclick="irSeccion('album')">Ver Fotos 📸</button>
</section>

<!-- MENSAJE ANIMADO -->
<section id="mensaje">
  <p id="textoAnimado" style="font-size:24px;"></p>
</section>

<!-- ÁLBUM -->
<section id="album">

  <div id="fotosIzquierda">
    <img src="capturas/foto1.png" style="transform:rotate(-8deg);">
    <img src="capturas/foto3.png" style="transform:rotate(6deg);">
    <img src="capturas/foto5.png" style="transform:rotate(-5deg);">
    <img src="capturas/foto7.png" style="transform:rotate(7deg);">
  </div>

  <div id="textoCentral"></div>

  <div id="fotosDerecha">
    <img src="capturas/foto2.png" style="transform:rotate(8deg);">
    <img src="capturas/foto4.png" style="transform:rotate(-6deg);">
    <img src="capturas/foto6.png" style="transform:rotate(5deg);">
    <img src="capturas/foto8.png" style="transform:rotate(-7deg);">
  </div>

</section>

<script>
function irSeccion(id){
  document.getElementById(id).scrollIntoView({behavior:'smooth'});
}

/* Texto animado 9 meses */
const mensaje9 = "Han pasado 9 meses desde que empezamos esta historia... y cada día contigo ha sido algo que jamás imaginé sentir. Gracias por cada risa, cada momento, cada mirada y cada recuerdo que hemos creado juntos 💖";
let i=0;
function escribirMensaje(){
  if(i<mensaje9.length){
    document.getElementById("textoAnimado").innerHTML+=mensaje9.charAt(i);
    i++;
    setTimeout(escribirMensaje,50);
  }
}

/* Texto central largo */
const textoLargo = "Desde que llegaste a mi vida, todo cambió. No sé cómo explicarlo exactamente, pero contigo aprendí lo que significa querer de verdad. Me haces sentir paz, emoción, ilusión y ganas de seguir construyendo algo más grande cada día. No importa el tiempo que pase, ni las dificultades que aparezcan, porque si es contigo, siempre vale la pena. Gracias por existir, por ser tú, por tu sonrisa, por tu mirada y por cada pequeño detalle que me regalas sin darte cuenta. Estos 9 meses son solo el inicio de algo mucho más grande… y quiero seguir escribiendo esta historia contigo 💖✨";
let j=0;
function escribirCentral(){
  if(j<textoLargo.length){
    document.getElementById("textoCentral").innerHTML+=textoLargo.charAt(j);
    j++;
    setTimeout(escribirCentral,30);
  }
}

/* Corazones */
function crearCorazon(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.style.left=Math.random()*100+"vw";
  heart.innerHTML="💖";
  heart.style.fontSize=(15+Math.random()*20)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),5000);
}
setInterval(crearCorazon,400);

window.onload=function(){
  escribirMensaje();
  escribirCentral();
}
</script>

</body>
</html>
