<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>9 meses juntos 💖</title>
<style>
body{margin:0; background:black; color:white; text-align:center; font-family:Arial; overflow:hidden;}
.estrellas{position:fixed;width:100%;height:100%;top:0;left:0;z-index:-1;}
.estrellas span{position:absolute;width:2px;height:2px;background:white;animation:parpadeo 2s infinite alternate;}
@keyframes parpadeo{from{opacity:0.2;}to{opacity:1;}}
button{padding:15px 35px;font-size:20px;border:none;border-radius:15px;background:#ff4d6d;color:white;cursor:pointer;margin-top:40px;}
button:hover{transform:scale(1.1);}
.corazon{position:fixed;font-size:25px;animation:caer linear infinite;}
@keyframes caer{to{transform:translateY(110vh);}}
#pantalla2{display:none;width:100%;height:100vh;position:absolute;top:0;left:0;background:black;color:white;padding-top:20vh;}
.mensaje{width:80%;max-width:500px;margin:auto;font-size:22px;white-space:pre-line;}
</style>
</head>
<body>

<div class="estrellas" id="estrellas"></div>

<!-- Pantalla inicial -->
<div id="pantalla1">
    <h1>¡Ya 9 meses juntos! 💖</h1>
    <p>Desde el 27/05/2025</p>
    <button id="botonSorpresa">Abrir sorpresa ✨</button>
</div>

<!-- Pantalla sorpresa -->
<div id="pantalla2">
    <h1>¡Sorpresa! 💖</h1>
    <div class="mensaje" id="mensajeSorpresa"></div>
</div>

<script>
// Crear estrellas
function crearEstrellas(){
    const cont=document.getElementById("estrellas");
    cont.innerHTML="";
    for(let i=0;i<150;i++){
        let s=document.createElement("span");
        s.style.left=Math.random()*100+"%";
        s.style.top=Math.random()*100+"%";
        s.style.animationDuration=(1+Math.random()*2)+"s";
        cont.appendChild(s);
    }
}
crearEstrellas();

// Corazones cayendo
function explosionCorazones(){
    for(let i=0;i<100;i++){
        let c=document.createElement("div");
        c.innerHTML="❤️";
        c.className="corazon";
        c.style.left=Math.random()*100+"vw";
        c.style.animationDuration=(2+Math.random()*3)+"s";
        document.body.appendChild(c);
    }
}

// Máquina de escribir
function escribirMensaje(texto){
    const cont=document.getElementById("mensajeSorpresa");
    cont.innerHTML="";
    let i=0;
    function escribir(){
        if(i<texto.length){
            cont.innerHTML+=texto.charAt(i);
            i++;
            setTimeout(escribir,40);
        }
    }
    escribir();
}

// Botón
document.getElementById("botonSorpresa").addEventListener("click",()=>{
    document.getElementById("pantalla1").style.display="none"; // Oculta todo lo anterior
    document.getElementById("pantalla2").style.display="block"; // Muestra la nueva sección
    explosionCorazones();
    escribirMensaje("Te amo mucho 💘\nYa cumplimos 9 meses juntos 💖\n¡Espero que te guste esta sorpresa! ✨");
});
</script>

</body>
</html>
