<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>9 Meses Juntos</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #ffe6f0;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }
  #sorpresa, #album, #botonImagenes { display: none; margin-top: 20px; }
  img { border-radius: 10px; transition: transform 0.5s; }
  button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    background: #ff6699;
    border: none;
    color: white;
  }
  .heart {
    position: fixed;
    color: #ff4da6;
    font-size: 24px;
    animation: fall 5s linear infinite;
    user-select: none;
  }
  @keyframes fall {
    0% { transform: translateY(-50px); opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
  }

  /* Álbum de fotos */
  .album {
    display: none;
    position: relative;
    height: 100vh;
    background: #ffe6f0;
  }
  .album img {
    width: 200px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center;
  }
  .album img:hover { transform: scale(1.1) rotate(0deg); }

  /* Texto central en el álbum */
  .album #textoCentral {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    color: #ff0066;
    background: rgba(255,255,255,0.6);
    padding: 20px;
    border-radius: 15px;
    width: 80%;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h1>¡Ya 9 meses juntos! 💖</h1>
<p>Desde el 27/05/2025</p>

<button onclick="mostrarSorpresa()">Abrir Sorpresa ✨</button>

<div id="sorpresa">
  <p id="mensaje"></p>
  <div id="botonImagenes">
    <button onclick="mostrarAlbum()">Ver tus fotos 📸</button>
  </div>
</div>

<div class="album" id="album">
  <div id="textoCentral"></div>
  <img src="capturas/foto1.png" alt="Foto 1">
  <img src="capturas/foto2.png" alt="Foto 2">
  <img src="capturas/foto3.png" alt="Foto 3">
  <img src="capturas/foto4.png" alt="Foto 4">
  <img src="capturas/foto5.png" alt="Foto 5">
  <img src="capturas/foto6.png" alt="Foto 6">
  <img src="capturas/foto7.png" alt="Foto 7">
  <img src="capturas/foto8.png" alt="Foto 8">
</div>

<script>
// Texto que se escribe letra por letra
const texto = "Te amo mucho 💘\nYa cumplimos otro mes más 💖";
let i = 0;
function escribirTexto() {
  if(i < texto.length){
    document.getElementById("mensaje").innerHTML += texto.charAt(i);
    i++;
    setTimeout(escribirTexto, 100);
  } else {
    document.getElementById('botonImagenes').style.display = 'block';
  }
}

function mostrarSorpresa() {
  document.getElementById('sorpresa').style.display = 'block';
  escribirTexto();
  iniciarCorazones();
}

// Mostrar álbum con fotos aleatorias y texto central que se escribe
function mostrarAlbum() {
  const album = document.getElementById('album');
  album.style.display = 'block';
  album.scrollIntoView({ behavior: 'smooth' });

  // Distribución aleatoria de las fotos
  const imgs = album.querySelectorAll('img');
  imgs.forEach(img => {
    const x = Math.random() * 400 - 200; // -200 a +200
    const y = Math.random() * 400 - 200;
    const rot = Math.random() * 30 - 15; // -15 a +15 grados
    img.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg)`;
  });

  // Texto central letra por letra
  const textoCentral = "Todo lo que siento por vos no cabe en palabras… te amo con todo mi corazón 💖";
  let j = 0;
  const txtDiv = document.getElementById('textoCentral');
  txtDiv.innerHTML = '';
  function escribirCentral() {
    if(j < textoCentral.length){
      txtDiv.innerHTML += textoCentral.charAt(j);
      j++;
      setTimeout(escribirCentral, 60);
    }
  }
  escribirCentral();
}

// Corazones cayendo
function crearCorazon() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.style.left = Math.random() * window.innerWidth + 'px';
  heart.style.fontSize = (14 + Math.random() * 20) + 'px';
  heart.innerHTML = '💖';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}

function iniciarCorazones() {
  setInterval(crearCorazon, 500);
}
</script>

</body>
</html>
