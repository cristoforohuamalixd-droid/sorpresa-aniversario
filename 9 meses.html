<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>9 Meses 💖</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#ffe6f0;
  overflow:hidden;
}

/* Secciones */
.seccion{
  display:none;
  height:100vh;
  width:100vw;
  position:absolute;
  top:0;
  left:0;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

.activa{
  display:flex;
}

/* Botones */
button{
  padding:12px 25px;
  margin:10px;
  border:none;
  border-radius:8px;
  background:#ff4da6;
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* Álbum */
#album{
  background:linear-gradient(135deg,#1a001f,#330033);
  flex-direction:row;
  justify-content:space-between;
}

.lado{
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:20px;
}

.lado img{
  width:140px;
  border-radius:12px;
}

#textoCentral{
  font-size:42px;
  color:#ff66cc;
  max-width:40%;
  line-height:1.4;
}

/* Corazones */
.heart{
  position:fixed;
  top:-20px;
  animation:fall 5s linear infinite;
}

@keyframes fall{
  to{ transform:translateY(100vh); opacity:0;}
}
</style>
</head>

<body>

<!-- INICIO -->
<div id="inicio" class="seccion activa">
  <h1>¡Sorpresa! 💖</h1>
  <p>
    Te amo mucho 💘<br>
    Ya cumplimos 9 meses juntos 💖<br>
    Y esto es solo el comienzo ✨
  </p>
  <button onclick="mostrar('mensaje')">Abrir Mensaje ✨</button>
  <button onclick="mostrar('album')">Ver Fotos 📸</button>
</div>

<!-- MENSAJE -->
<div id="mensaje" class="seccion">
  <p id="textoAnimado" style="font-size:24px;"></p>
  <button onclick="mostrar('album')">Ver Fotos 📸</button>
</div>

<!-- ALBUM -->
<div id="album" class="seccion">

  <div class="lado">
    <img src="capturas/foto1.png">
    <img src="capturas/foto3.png">
    <img src="capturas/foto5.png">
    <img src="capturas/foto7.png">
  </div>

  <div id="textoCentral"></div>

  <div class="lado">
    <img src="capturas/foto2.png">
    <img src="capturas/foto4.png">
    <img src="capturas/foto6.png">
    <img src="capturas/foto8.png">
  </div>

</div>

<script>

/* Cambiar secciones */
function mostrar(id){
  document.querySelectorAll('.seccion').forEach(s=>s.classList.remove('activa'));
  document.getElementById(id).classList.add('activa');

  if(id==="mensaje") escribirMensaje();
  if(id==="album") escribirCentral();
}

/* Texto mensaje */
const mensaje9="Han pasado 9 meses desde que empezamos esta historia... y cada día contigo ha sido algo que jamás imaginé sentir. Gracias por cada risa, cada momento, cada mirada y cada recuerdo que hemos creado juntos 💖";
let i=0;
function escribirMensaje(){
  document.getElementById("textoAnimado").innerHTML="";
  i=0;
  function escribir(){
    if(i<mensaje9.length){
      document.getElementById("textoAnimado").innerHTML+=mensaje9.charAt(i);
      i++;
      setTimeout(escribir,40);
    }
  }
  escribir();
}

/* Texto central largo */
const textoLargo="Desde que llegaste a mi vida, todo cambió. No sé cómo explicarlo exactamente, pero contigo aprendí lo que significa querer de verdad. Me haces sentir paz, emoción, ilusión y ganas de seguir construyendo algo más grande cada día. No importa el tiempo que pase, porque si es contigo, siempre vale la pena. Estos 9 meses son solo el inicio de algo mucho más grande… y quiero seguir escribiendo esta historia contigo 💖✨";
let j=0;
function escribirCentral(){
  document.getElementById("textoCentral").innerHTML="";
  j=0;
  function escribir(){
    if(j<textoLargo.length){
      document.getElementById("textoCentral").innerHTML+=textoLargo.charAt(j);
      j++;
      setTimeout(escribir,25);
    }
  }
  escribir();
}

/* Corazones */
function crearCorazon(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.style.left=Math.random()*100+"vw";
  heart.innerHTML="💖";
  heart.style.fontSize=(15+Math.random()*20)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),5000);
}
setInterval(crearCorazon,400);

</script>

</body>
</html>
